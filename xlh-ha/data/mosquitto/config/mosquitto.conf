# Basic listener configuration
listener 1883
allow_anonymous true

# WebSocket listener
listener 9001
protocol websockets
allow_anonymous true

# Persistence
# persistence true
# persistence_location /mosquitto/data/

# Logging
# https://mosquitto.org/man/mosquitto-conf-5.html
# https://cedalo.com/blog/mosquitto-mqtt-broker-logging/
log_dest none
#log_dest file /mosquitto/log/mosquitto.log
#log_type error
#log_type warning
#log_type notice
#log_type information
log_type none
